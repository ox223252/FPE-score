<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon"       type="image/png" href="/imgs/logo.png" />
<link rel="stylesheet" type="text/css"  href="/css/color.css">
<link rel="stylesheet" type="text/css"  href="/css/main.css">
<link rel="stylesheet" type="text/css"  href="/fontawesome/css/all.min.css">

<title><%= locals.title %></title>
<script src="/socket.io.js" nonce="<%- locals.nonce %>"></script>
<script nonce="<%- locals.nonce %>">
	var socket = io.connect ( window.location.origin ,{
		reconnection: true,
		reconnectionAttempts: 50,
		reconnectionDelay: 5000,
		reconnectionDelayMax: 25000,
	});

	let firstConnection = true;

	socket.on ( "connect", ()=>{
		let nav = [ ...document.getElementsByClassName ( "connectionStatus" ) ].map ( n=>{
				n.classList.remove ( "disconnected" );
			});

		if ( firstConnection
			|| !localStorage.getItem ( <%- js ( locals.title ) %> ) )
		{ // première connexion, ou pas de jeton pour se reconnecter : le serveur lit l'état de la session
			firstConnection = false;

			socket.emit ( "identify", {
				page: <%- js ( locals.page ) %>
			});
		}
		else
		{ // reconnect : on se reconnecte avec le jeton
			fetch ( "/ajax/login", {
					method: "POST",
					body: JSON.stringify( {token: localStorage.getItem ( <%- js ( locals.title ) %> ) }),
					headers: { "Content-Type": "application/json" },
				})
				.then ( r=>{
					if ( r.ok )
					{
						return r.json ( );
					}
					else
					{
						throw r;
					}
				})
				.then ( ()=>{
					// si le serveur a redémarré, la session ( et son cookie ) est nouvelle :
					// on rouvre la socket pour qu'elle utilise le nouveau cookie
					firstConnection = true;
					socket.disconnect ( ).connect ( );
				})
				.catch ( ()=>{
					window.location.href = window.location.origin;
				})
		}
	});

	socket.on ( "disconnect", ()=>{
		let nav = [ ...document.getElementsByClassName ( "connectionStatus" ) ].map ( n=>{
				n.classList.add ( "disconnected" );
			});
	});
</script>
