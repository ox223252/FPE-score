<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon"       type="image/png" href="imgs/logo.png" />
<link rel="stylesheet" type="text/css"  href="css/color.css">
<link rel="stylesheet" type="text/css"  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" type="text/css"  href="css/main.css">

<title><%= locals.title %></title>
<script src="socket.io.js" nonce="<%- locals.nonce %>"></script>
<script nonce="<%- locals.nonce %>">
	var socket = io.connect ( window.location.origin ,{
		reconnection: true,
		reconnectionAttempts: 50,
		reconnectionDelay: 5000,
		reconnectionDelayMax: 25000,
	});

	let firstConnection = true;

	socket.on ( "connect", ()=>{
		let nav = [ ...document.getElementsByClassName ( "connectionStatus" ) ].map ( n=>{
				n.classList.remove ( "disconnected" );
			});

		if ( firstConnection )
		{
			socket .emit ( "identify", {
				user: <%- js ( locals.user ) %>,
				page: <%- js ( locals.page ) %>
			});
		}
		else if ( !localStorage.getItem ( <%- js ( locals.title ) %> ) )
		{ // if no token -> strange
			socket .emit ( "identify", {
				user: <%- js ( locals.user + "-disconnected" ) %>,
				page: <%- js ( locals.page ) %>
			});
		}
		else
		{ // reconnect
			fetch ( "/ajax/login", {
					method: "POST",
					body: JSON.stringify( {token: localStorage.getItem ( <%- js ( locals.title ) %> ) }),
					headers: { "Content-Type": "application/json" },
				})
				.then ( r=>{
					if ( r.ok )
					{
						return r.json ( );
					}
					else
					{
						throw r.json ( );
					}
				})
				.then ( ()=>{
					socket .emit ( "identify", {
						user: <%- js ( locals.user ) %>,
						page: <%- js ( locals.page ) %>
					});
				})
				.catch ( ()=>{
					window.location.href = window.location.origin;
				})
		}

		firstConnection = false;
	});

	socket.on ( "disconnect", ()=>{
		let nav = [ ...document.getElementsByClassName ( "connectionStatus" ) ].map ( n=>{
				n.classList.add ( "disconnected" );
			});
	});


	socket.on ( "disconnect", ()=>{
		let nav = [ ...document.getElementsByClassName ( "connectionStatus" ) ].map ( n=>{
				n.classList.add ( "disconnected" );
			});
	});
</script>
