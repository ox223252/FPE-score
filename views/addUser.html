<!DOCTYPE html>
<html>
	<%- include("part/head.html") -%>
	<body>
		<%- include("part/nav.html") -%>
		<style>
			input[type=radio] {
				display: none;
			}
			div:has(input[type=radio]) ~ div {
				display: none !important;
			}
			div:has(#juge:checked) ~ div.juge {
				display: inherit !important;
			}
			div:has(#admin:checked) ~ div.admin {
				display: inherit !important;
			}
			div:has(#staff:checked) ~ div.staff {
				display: inherit !important;
			}
			div:has(#competitor:checked) ~ div.competitor {
				display: inherit !important;
			}

			#juge:checked ~ label.juge {
				background-color: var( --grey );
			}
			#admin:checked ~ label.admin {
				background-color: var( --grey );
			}
			#staff:checked ~ label.staff {
				background-color: var( --grey );
			}
			#competitor:checked ~ label.competitor {
				background-color: var( --grey );
			}
		</style>
		<section>
			<div class="form">
				<div>
					<% switch ( locals.logged )
					{
						case "admin": 
						{ %>
							<input type="radio" name="userType" id="admin">
							<label class="admin button" for="admin">Admin</label>
							<input type="radio" name="userType" id="staff">
							<label class="staff button" for="staff">Staff</label>
						<% }
						case "staff":
						{ %>
							<input type="radio" name="userType" id="juge">
							<label class="juge button" for="juge">Juge</label>
							<input type="radio" name="userType" id="competitor" checked>
							<label class="competitor button" for="competitor">Compétiteur</label>
						<% } 
						default:
						{ %>
						<% }
					} %>
				</div>

				<hr style="width: 90%;">
				<div class="juge admin competitor staff">
					<label>Nom Prénom :</label>
					<input id="name" list="nameList" type="text" placeholder="Nom Prenom">
					<datalist id="nameList"></datalist>
				</div>
				<div class="juge admin staff">
					<label>Password :</label>
					<input id="pass" type="password" placeholder="Password">
				</div>
				<div class="competitor">
					<label for="categorie">Catégorie</label>
					<select id="categorie">
					</select>
				</div>
				<div class="competitor">
					<label for="genre">Genre</label>
					<select id="genre">
						<option disabled selected>--</option>
						<option value="M">homme</option>
						<option value="F">femme</option>
					</select>
				</div>
				<div class="competitor">
					<label for="club">Club</label>
					<input id="club" list="clubList" placeholder="club" type="text">
					<datalist id="clubList">
						<option value="test"></option>
					</datalist>
				</div>
				<button id="validate">Sauver</button>
			</div>
			<p id="serverMsg"></p>
		</section>
		<script type="text/javascript" nonce="<%- locals.nonce %>" src="/js/utils.js"></script>
		<script type="text/javascript" nonce="<%- locals.nonce %>">
			let domEls = {
				name: document.getElementById ( "name" ),
				pass: document.getElementById ( "pass" ),
				nameList: document.getElementById ( "nameList" ),
				categorie: document.getElementById ( "categorie" ),
				categorieList: document.getElementById ( "categorie" ),
				genre: document.getElementById ( "genre" ),
				club: document.getElementById ( "club" ),
				clubList: document.getElementById ( "clubList" ),
				validate: document.getElementById ( "validate" ),
				serverMsg: document.getElementById ( "serverMsg" ),
			};

			if ( !socket )
			{
				var socket = io ( );
			}

			let users = <%- JSON.stringify ( locals.users ) %>;
			let genres = <%- JSON.stringify ( locals.genres ) %>;
			let categories = <%- JSON.stringify ( locals.categories ) %>;

			uOneSlector ({
				default:"genre",
				selector:domEls.genre,
				list:genres,
			});
			uOneSlector ({
				default:"categorie",
				selector:domEls.categorieList,
				list:categories,
			});
			uOneSlector ({
				default:"club",
				selector:domEls.clubList,
				list:users.map ( u2=>u2.club ).distinct ( ).sort ( ),
			});
			uOneSlector ({
				default: "",
				selector: domEls.nameList,
				list:users.map ( u2=>u2.name ).distinct ( ).sort ( ),
			});

			domEls.validate.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );
				let data = {
					group: document.querySelectorAll ( "input[name=userType]:checked" )[ 0 ].id,
					name: domEls.name.value.trim ( ),
				};

				domEls.serverMsg.innerText = "";

				if ( undefined == data.name )
				{
					domEls.serverMsg.innerText = "il manque le nom";
					return;
				}

				switch ( data.group )
				{
					case "competitor":
					{
						data.categorie = domEls.categorie.value;
						data.genre = domEls.genre.value;
						data.club = domEls.club.value;
						break;
					}
					case "admin":
					case "staff":
					case "juge":
					{
						data.pass = domEls.pass.value;
						break;
					}
				}

				for ( let key in data )
				{
					if ( !data[ key ])
					{
						domEls.serverMsg.innerText = "il manque une info : "+key;
						return;
					}
				}

				fetch ( "/ajax/set/user", {
						method: "POST",
						body: JSON.stringify ( data ),
						headers: { "Content-Type" : "application/json" }
					})
					.then ( r=>{
						if ( r.ok )
						{
							return r.json ( );
						}
						else
						{
							throw r
						}
					})
					.then ( onOk )
					.catch ( onError )
			});

			socket.on ( "users", ( msg )=>{
				users = msg;

				uOneSlector ({
					default: "",
					selector: domEls.nameList,
					list:users.map ( u2=>u2.name ).distinct ( ).sort ( ),
				});

				uOneSlector ({
					default:"club",
					selector:domEls.clubList,
					list:users.map ( u2=>u2.club ).distinct ( ).sort ( ),
				});
			});
		</script>
	</body>
</html>
