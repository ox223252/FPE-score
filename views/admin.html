<!DOCTYPE html>
<html>
	<head>
		<%- include("part/head.html") -%>
		<style>
			.transparent {
				gap: 20px;
			}

			input[ type=file ] {
				display: none;
			}

			.buttonDiv {
				flex-grow: 0 !important;
			}

			section {
				background-color: transparent !important;
				grap: 10px;
			}

			.form {
				flex-shrink: 1;

				background-color: var( --grey );
				border-radius: 10px;

				&:first-child {
					flex-shrink: 0;
				}
			}
		</style>
	</head>
	<body>
		<%- include("part/nav.html") -%>
		<section class="transparent">
			<div class="form">
				<div style="justify-content: space-between;">
					<button id="start">Start</button>
					<button id="stop">Stop</button>
				</div>
			</div>
			<div class="form">
				<div>
					<label for="time">Durée de la competition en minutes</label>
					<input id="time" type="number" value="60" placeholder="temps en minutes"/>
				</div>

				<div>
					<label>Quelles categories</label>
					<div id="categories"></div>
				</div>
				<p id="serverMsg"></p>
			</div>
			<div class="form specific">
				<div>
					<div>
						CSV contenant les competiteurs (<%- locals.users?.length %>)
						<input id="usersFiles" type="file"/>
					</div>
					<div class="buttonDiv">
						<button id="usersClean" class="fa-solid fa-trash"></button>
						<button id="usersExport" class="fa-solid fa-download"></button>
						<label for="usersFiles" class="button fa-solid fa-upload"></label>
					</div>
				</div>
				<div>
					<div class="buttonDiv">
						<button id="routesClean" class="fa-solid fa-trash"></button>
						<button id="routesExport" class="fa-solid fa-download"></button>
						<label for="routesFiles" class="button fa-solid fa-upload"></label>
					</div>
					<div>
						CSV contenant les routes (<%- locals.routes?.length %>)
						<input id="routesFiles" type="file"/>
					</div>
				</div>
				<div>
					<div>
						Fichier scores
					</div>
					<div class="buttonDiv">
						<button id="scoreClean" class="fa-solid fa-trash"></button>
						<button id="scoreExport" class="fa-solid fa-download"></button>
					</div>
				</div>
				<div>
					<div class="buttonDiv">
						<button id="halt" class="fa-solid fa-power-off" style="color:red"></button>
					</div>
					<div>
						Eteindre le systeme
					</div>
				</div>
				<p id="serverMsg"></p>
			</div>
		</section>
		<script type="text/javascript" nonce="<%- locals.nonce %>" src="/js/utils.js"></script>
		<script nonce="<%- locals.nonce %>">
			let domEls = {
				serverMsg: document.getElementById ( "serverMsg" ),
				input:{
					categories: {
						main: document.getElementById ( "categories" ),
					},
				},
				start: document.getElementById ( "start" ),
				stop: document.getElementById ( "stop" ),
				halt: document.getElementById ( "halt" ),
				users: {
					set: document.getElementById ( "usersFiles" ),
					delete: document.getElementById ( "usersClean" ),
					export: document.getElementById ( "usersExport" ),
				},
				routes: {
					set: document.getElementById ( "routesFiles" ),
					delete: document.getElementById ( "routesClean" ),
					export: document.getElementById ( "routesExport" ),
				},
				scores: {
					delete: document.getElementById ( "scoreClean" ),
					export: document.getElementById ( "scoreExport" ),
				},
			};

			if ( !socket )
			{
				var socket = io ( );
			}

			let users = <%- JSON.stringify ( locals.users ) %>;
			let routes = <%- JSON.stringify ( locals.routes ) %>;
			let types = <%- JSON.stringify ( locals.types ) %>;
			let categories = <%- JSON.stringify ( locals.categories ) %>;

			uOneCheckList ({
				key: "categories",
				outList: domEls.input,
				list: categories,
			});

			domEls.start.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				let data = {
					time: Number ( document.getElementById ( "time").value ),
					categories: getChecked ( domEls.input.categories )
				};

				sendCmd ( "/ajax/start", data )
					.then ( onOk )
					.catch ( onError );
			});

			domEls.stop.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				sendCmd ( "/ajax/stop" )
					.then ( onOk )
					.catch ( onError );
			});

			domEls.halt.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				if ( confirm ( "Vous allez eteindre le systeme etes vous sur ?" ) )
				{
					sendCmd ( "/ajax/halt" )
						.then ( onOk )
						.catch ( onError );
				}
			});

			function sendCmd ( path, data = {} )
			{
				return fetch ( path,{
						method:"POST",
						body: JSON.stringify ( data ),
						headers: { "Content-Type":"application/json" }
					})
					.then ( r=>{
						if ( r.ok )
						{
							return r.json ( );
						}
						else
						{
							throw r;
						}
					})
			}

			[ "users", "routes", "scores" ].map ( file=>{
				Object.keys ( domEls[ file ] ).map ( cmd=>{
					let evName = undefined;

					if (  "BUTTON" == domEls[ file ][ cmd ].nodeName )
					{
						evName = "click";
					}
					else
					{
						evName = "change";
					}


					domEls[ file ][ cmd ].addEventListener ( evName, async ( ev )=>{
						ev.preventDefault ( );

						let data = {};

						switch ( cmd )
						{
							case "delete":
							{
								if ( !confirm ( "Vous allez supprimer un base de donnée, c'est irréversible" ) )
								{
									return;
								}

								break;
							}
							case "set":
							{
								let newDb = ev.target.files?.[ 0 ];

								if ( !newDb )
								{
									return;
								}

								let reader = new FileReader ( );
								reader.readAsText ( newDb, "UTF-8" );
								
								switch ( [ file ]?.constructor.name )
								{
									case "Array":
									{
										data = await new Promise ( (ok,ko)=>{
											reader.onload = (ev)=>{
												let lines = ev.target.result.split ( "\n" );
												let keys = lines.shift ( ).split ( ";" );

												lines = lines.map ( line=>{
													let r = line.split ( ";" )
														.map ( (cell,index)=>{
															if ( "" == cell )
															{
																return {};
															}

															if ( "routes" == file )
															{
																if ( [ "categories", "scores" ].includes ( keys[ index ] ) )
																{
																	return {
																		[ keys[ index ] ]: cell.split( ',' )
																	}
																}
															}
															
															return {
																[ keys[ index ] ]: cell
															};
														})
														.reduce ( (a,v)=>{
															return Object.assign ( a, v );
														}, {})

													if ( "bloc" == r.type )
													{
														r.scores = {
															zone: r.scores[ 0 ],
															top: r.scores[ 1 ]
														};
													}

													return r;
												});

												ok ( lines );
											};
										});

										break;
									}
								}
								break;
							}
						}

						sendCmd ( `/ajax/db/${cmd}/${file}`, data )
							.then ( r=>{
								if ( "export" == cmd )
								{
									exportFile ( r, file );
								}
							})
							.then ( onOk )
							.catch ( onError )
					});
				});
			});
		</script>
	</body>
</html>
