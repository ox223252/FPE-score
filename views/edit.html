<!DOCTYPE html>
<html>
	<%- include("part/head.html") -%>
	<body>
		<%- include("part/nav.html") -%>
		<section>
			<div class="form">
				<div>
					<label for="genre">Genre</label>
					<select id="genre"></select>
				</div>
				<div>
					<label for="categorie">Categorie</label>
					<select id="categorie"></select>
				</div>
				<div>
					<label for="club">Club</label>
					<select id="club"></select>
				</div>
				<div>
					<label for="name">Utilisateur</label>
					<select id="name"></select>
				</div>
			</div class="form">
			<div>
				<table>
					<thead id="thead"></thead>
					<tbody id="tbody"></tbody>
				</table>
			</div>
			<div id="serverMsg"></div>
		</section>
		<script type="text/javascript" src="/js/utils.js"></script>
		<script type="text/javascript" nonce="<%- locals.nonce %>">
			Array.prototype.distinct = function () { return Array.from ( new Set ( this ) ); };

			let domEls = {
				input:{
					genre: document.getElementById ( "genre" ),
					categorie: document.getElementById ( "categorie" ),
					club: document.getElementById ( "club" ),
					name: document.getElementById ( "name" ),
					nameList: document.getElementById ( "nameList" ),
				},
				table: {
					tbody: document.getElementById ( "tbody" ),
					thead: document.getElementById ( "thead" ),
				},
			};
		
			let scores = <%- JSON.stringify ( locals.scores ) %>;
			let routes = <%- JSON.stringify ( locals.routes ) %>;
			let users = <%- JSON.stringify ( locals.users ) %>;
			let filters = {};
			let event = new EventTarget ( );

			function initUsersSelector ( array )
			{
				uOneSlector ({
						default:"genre",
						selector:domEls.input.genre,
						list:array.map ( u2=>u2.genre ).distinct ( )
					});
				uOneSlector ({
						default:"categorie",
						selector:domEls.input.categorie,
						list:array.map ( u2=>u2.categorie ).distinct ( )
					});
				uOneSlector ({
						default:"club",
						selector:domEls.input.club,
						list:array.map ( u2=>u2.club ).distinct ( )
					});
				uOneSlector ({
						default:"--",
						selector:domEls.input.nameList,
						list:array.map ( u2=>u2.name ).distinct ( )
					});

				domEls.input.nameList.options[ 0 ].disabled = true;
			}


			printTable ({
					thead: domEls.table.thead,
					tbody: domEls.table.tbody,
					scores: scores,
					filters: filters,
					routes: routes.map ( r=>r.name ),
					users: users,
					event: event,
				});

			initUsersSelector ( users );

			[ "genre", "categorie", "club" ].map ( key=>{
				domEls.input[ key ].addEventListener ( "change", (ev)=>{
					if ( "all" == ev.target.value )
					{
						delete filters[ key ];
					}
					else
					{
						filters[ key ] = ev.target.value;
					}


					let filteredUsers = users;

					for ( let key in filters )
					{
						filteredUsers = filteredUsers.filter ( u=>u[ key ] == filters[ key ] );
					}

					printTable ({
							thead: domEls.table.thead,
							tbody: domEls.table.tbody,
							scores: scores,
							filters: filters,
							routes: routes.map ( r=>r.name ),
							users: users,
							event: event,
						});
				})
			});

			socket.on ( "scores", (msg)=>{
				scores = msg;

				domEls.input.name.dispatchEvent ( new Event ( "change" ) );
			});

			socket.on ( "users", (msg)=>{
				users = msg;

				initUsersSelector ( users );
			})


			domEls.input.name.addEventListener ( "change",  ( ev )=>{
				console.log ( ev.target )
				if ( users.map ( u=>u.name ).includes ( ev.target.value ) )
				{
					printTableOneUser ({
							thead: domEls.table.thead,
							tbody: domEls.table.tbody,
							scores: scores,
							routes: routes.map ( r=>r.name ),
							users: ev.target.value,
							event: event,
						});
				}
				else
				{
					printTable ({
							thead: domEls.table.thead,
							tbody: domEls.table.tbody,
							scores: scores,
							filters: filters,
							routes: routes.map ( r=>r.name ),
							users: users,
							event: event,
						});
				}
			});

			event.addEventListener ( "name", ( ev )=>{
				if ( "all" == domEls.input.name.value )
				{
					domEls.input.name.value = ev.value;
				}
				else
				{
					domEls.input.name.value = "all";
				}

				domEls.input.name.dispatchEvent ( new Event ( "change" ) );
			});

			event.addEventListener ( "value", ( ev )=>{
				fetch ( "/ajax/set/value", {
						method: "POST",
						body: JSON.stringify ( ev.data ),
						headers: { "Content-Type": "application/json" }
					})
					.then ( r=>{
						if ( r.ok )
						{
							return 0
						}
						else
						{
							throw r;
						}
					})
					.then ( onOk )
					.catch (  onError );
			});
		</script>
	</body>
</html>
