<!DOCTYPE html>
<html>
	<%- include("part/head.html") -%>
	<body>
		<%- include("part/nav.html") -%>
		<section>
			<div class="form">
				<div id="divGenre">
					<label for="genre">Genre</label>
					<select id="genre"></select>
				</div>
				<div id="divCategorie">
					<label for="categorie">Categorie</label>
					<select id="categorie"></select>
				</div>
				<div id="divClub">
					<label for="club">Club</label>
					<select id="club"></select>
				</div>
				<div  id="divUser" class="row">
					<div style="flex-grow: 2;">
						<label for="user">Utilisateur</label>
						<input id="user" list="listUser"></input>
						<datalist id="listUser"></datalist>
					</div>
					<div>
						<label for="dossard">Dossard</label>
						<input id="dossard" list="listDossard"></input>
						<datalist id="listDossard"></datalist>
					</div>
				</div>
				<hr>
				<div id="divType">
					<label for=type>Type de voie</label>
					<select id="type"></select>
				</div>
				<div id="divVoie">
					<label for=voie>Voie</label>
					<select id="voie"></select>
				</div>
				<div class="marged">
					<input id="scoreDiff"></input>
					<select id="scoreBloc">
						<option disabled selected>--</option>
						<option value="echec">Echec</value>
						<option value="zone">Zone</value>
						<option value="top">Top</value>
					</select>
					<div id="divChrono" class="row">
						<button id="chronoStart">Start</button>
						<input id="chronoTime" type="time" step="0.001"/>
						<button id="chronoStop">Stop</button>
						<button id="chronoAbandon">Abandon</button>
					</div>
				</div>
				<div>
					<button id="validate">Valider</button>
				</div>
			</div class="form">
			<img id="img"></img>
			<div id="comments">
			</div>
			<p id="serverMsg">
			</p>
		</section>
		<script type="text/javascript" nonce="<%- locals.nonce %>" src="/js/utils.js"></script>
		<script type="text/javascript" nonce="<%- locals.nonce %>">
			let domEls = {
				club: document.getElementById ( "club" ),
				genre: document.getElementById ( "genre" ),
				categorie: document.getElementById ( "categorie" ),
				user:  document.getElementById ( "user" ),
				dossard:  document.getElementById ( "dossard" ),
				listUser:  document.getElementById ( "listUser" ),
				listDossard:  document.getElementById ( "listDossard" ),
				type:  document.getElementById ( "type" ),
				voie:  document.getElementById ( "voie" ),
				start: document.getElementById ( "chronoStart" ),
				stop:  document.getElementById ( "chronoStop" ),
				abandon: document.getElementById ( "chronoAbandon" ),
				validate: document.getElementById ( "validate" ),
				img: document.getElementById ( "img" ),
				score: {
					diff: document.getElementById ( "scoreDiff" ),
					bloc: document.getElementById ( "scoreBloc" ),
					chrono: document.getElementById ( "chronoTime" ),
				},
				serverMsg: document.getElementById ( "serverMsg" ),
				comments: document.getElementById ( "comments" ),
				div:{
					genre: document.getElementById ( "divGenre"),
					categorie: document.getElementById ( "divCategorie"),
					club: document.getElementById ( "divClub"),
					user: document.getElementById ( "divUser"),
					type: document.getElementById ( "divType" ),
					voie: document.getElementById ( "divVoie" ),
					chrono: document.getElementById ( "divChrono" ),
				},
			};

			domEls.score.bloc.style.display = "none";
			domEls.score.diff.style.display = "none";
			domEls.div.chrono.style.display = "none";
			domEls.comments.display = "none";
			domEls.serverMsg.display = "none";
			domEls.img.style.display = "none";

			if ( !socket )
			{
				var socket = io ( );
			}

			let routes = <%- JSON.stringify ( locals.routes ) %>;
			let types = <%- JSON.stringify ( locals.types ) %>;
			let users = <%- JSON.stringify ( locals.users ) %>;

			// user
			function initUsersSelector ( array )
			{
				uOneSlector ({
					default:"genre",
					selector:domEls.genre,
					list:array.map ( u2=>u2.genre ).distinct ( ).sort ( ),
				});
				uOneSlector ({
					default:"categorie",
					selector:domEls.categorie,
					list:array.map ( u2=>u2.categorie ).distinct ( ).sort ( ),
				});
				uOneSlector ({
					default:"club",
					selector:domEls.club,
					list:array.map ( u2=>u2.club ).distinct ( ).sort ( ),
				});
				uOneSlector ({
					default:"user",
					selector:domEls.listUser,
					list:array.map ( u2=>u2.name ).distinct ( ).sort ( ),
				});
				uOneSlector ({
					default:"dossard",
					selector:domEls.listDossard,
					obj:{
						valueId:"name",
						textId:"dossard",
						list:array.distinct ( ).sort ( (a,b)=>{
							return a.dossard - b.dossard;
						}),
					},
					parentDiv:domEls.div.user,
				});

				domEls.listUser.options[ 0 ].disabled = true;
				domEls.listDossard.options[ 0 ].disabled = true;
			}
			
			initUsersSelector ( users );

			// route
			uOneSlector ({
				default:"--",
				selector:domEls.type,
				list:types,
				parentDiv:domEls.div.type
			});
			uOneSlector ({
				default:"voie",
				selector:domEls.voie,
				list:routes.map ( r=>r.name ),
				parentDiv:domEls.div.voie
			});
			domEls.type.options[ 0 ].disabled = true;
			domEls.voie.options[ 0 ].disabled = true;

			domEls.score.bloc.style.display = "none";
			domEls.score.diff.style.display = "none";
			domEls.div.chrono.style.display = "none";

			function initRoute ( route )
			{
				if ( route.comments )
				{
					domEls.comments.display = "";
					domEls.comments.innerText = route.comments;
				}
				else
				{
					domEls.comments.display = "none";
				}

				if ( route.img )
				{
					domEls.img.style.display = "";
					domEls.img.src = route.img;
				}
				else
				{
					domEls.img.style.display = "none";
				}

				domEls.score.bloc.style.display = "none";
				domEls.score.diff.style.display = "none";
				domEls.div.chrono.style.display = "none";

				switch ( route.type )
				{
					case "bloc":
					{
						domEls.score.bloc.style.display = "";
						break;
					}
					case "diff":
					{
						domEls.score.diff.style.display = "";
						if ( route.scores )
						{
							if ( "select" != domEls.score.diff.nodeName.toLowerCase ( ) )
							{
								let s = document.createElement ( "select" );
								s.id = domEls.score.diff.id;

								domEls.score.diff.replaceWith ( s );
								domEls.score.diff = s;
							}

							let tableS = [];
							tableS.push ( {text:"Echec",value:0} );

							route.scores.map ( (score,i)=>tableS.push ({text:"Degaine "+(i+1),value:score}) )

							uOneSlector ({
								default:"score",
								selector:domEls.score.diff,
								obj:{
									valueId:"value",
									textId:"text",
									list:tableS,
								},
								parentDiv:domEls.div.user
							})
							domEls.score.diff.options[ 0 ].disabled = true;
						}
						else
						{
							if ( "input" != domEls.score.diff.nodeName.toLowerCase ( ) )
							{
								let i = document.createElement ( "input" );
								i.id = domEls.score.diff.id;
								
								domEls.score.diff.replaceWith ( i );
								domEls.score.diff = i;
							}
						}
						break;
					}
					case "vitesse":
					case "endurance":
					{
						domEls.div.chrono.style.display = "";
						break;
					}
					case "slack":
					{
						domEls.score.diff.style.display = "";
						break;
					}
					default:
					{
						console.error ( "type inconnue" );
						console.error ( route );
						break;
					}
				}
			}

			let filters = {};

			for ( let key of [ "club","genre","categorie"] )
			{
				domEls[ key ].addEventListener ( "change", (ev)=>{
					if ( "all" == ev.target.value )
					{
						delete filters[ key ];
					}
					else
					{
						filters[ key ] = ev.target.value;
					}

					let filteredUsers = users;

					for ( let key in filters )
					{
						filteredUsers = filteredUsers.filter ( u=>u[ key ] == filters[ key ] );
					}

					initUsersSelector ( filteredUsers );
				} )
			}

			domEls.type.addEventListener ( "change", (ev)=>{
				uOneSlector ({
					default:"voie",
					selector:domEls.voie,
					list:routes.filter ( r=>r.type == ev.target.value ).map ( r=>r.name ),
					parentDiv:domEls.div.voie
				});

				domEls.score.bloc.style.display = "none";
				domEls.score.diff.style.display = "none";
				domEls.div.chrono.style.display = "none";
			});

			domEls.voie.addEventListener ( "change", (ev)=>{
				if ( ev.target.value == "all" )
				{
					return;
				}

				let index = routes.map ( r=>r.name ).indexOf ( ev.target.value );

				if ( index < 0 )
				{
					alert ( "unknow route" );
				}
				else
				{
					initRoute ( routes[ index ] )
				}
			});

			domEls.validate.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );
				domEls.serverMsg.display = "none";

				if ( domEls.user.value == domEls.user.options[ 0 ].value )
				{
					domEls.serverMsg.innerText = "le competiteur n'est pas renseigné"
					domEls.user.classList.add ( "err" )
					return;
				}
				else
				{
					domEls.user.classList.remove ( "err" )
				}

				if ( domEls.voie.value == domEls.voie.options[ 0 ].value )
				{
					domEls.serverMsg.innerText = "la voie n'est pas renseigné"
					domEls.user.classList.add ( "err" )
					return;
				}
				else
				{
					domEls.user.classList.remove ( "err" )
				}

				let data = {
					user: domEls.user.value,
					route: domEls.voie.value,
					score:{
						diff: domEls.score.diff.value,
						bloc: domEls.score.bloc.value,
						vitesse: domEls.score.chrono.value.split ( ":" ).reduce ( (a,v,i)=>{
								return ( 2 == i )
									? ( a + v.split ( "." )[ 0 ] ) * 1000 + Number ( v.split ( "." )[ 1 ] )
									: a * 60 + v;
							},0 ),
					}
				};

				ajaxReq ( "/ajax/set/score", data )
				
				domEls.validate.disabled = true;
			});

			let startTime = 0;
			let interval = undefined;
			domEls.start.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				if ( interval )
				{
					return;
				}

				startTime = new Date ( ).getTime ( );

				interval = setInterval ( ()=>{
					domEls.score.chrono.value = new Date ( new Date ( ).getTime ( ) - startTime ).toISOString().substring(11,23)
				}, 13 );
			
				domEls.validate.disabled = true;
			});

			domEls.stop.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				if ( !interval )
				{
					return;
				}
				stopTime = new Date ( ).getTime ( );

				domEls.score.chrono.value = new Date ( stopTime - startTime ).toISOString().substring(11,23)

				clearInterval ( interval );
				interval = undefined;

				domEls.validate.disabled = false;
			});

			domEls.abandon.addEventListener ( "click", (ev)=>{
				ev.preventDefault ( );

				startTime = 0;

				clearInterval ( interval );
				interval = undefined;

				domEls.validate.disabled = true;
			});

			domEls.dossard.addEventListener ( "change", (ev)=>{
				domEls.user.value = users.filter ( u=>u.dossard == ev.target.value )?.[ 0 ]?.name ?? "";
			});

			domEls.user.addEventListener ( "change", (ev)=>{
				domEls.dossard.value = users.filter ( u=>u.name == ev.target.value )?.[ 0 ]?.dossard ?? "";
			});


			domEls.score.diff.addEventListener ( "change", (ev)=>{
				domEls.validate.disabled = false;
			});
			domEls.score.bloc.addEventListener ( "change", (ev)=>{
				domEls.validate.disabled = false;
			});
		</script>
	</body>
</html>
